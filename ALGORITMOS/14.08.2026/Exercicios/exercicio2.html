<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. Calculadora de Peso e Altura</title>
</head>
<body>
    <h2>2. Calculadora de Peso e Altura</h2>

    <span>Peso:</span>
    <input placeholder="Insira aqui:" id="peso" type="text">
    <br>
    <br>
    <span>Altura:</span>
    <input placeholder="Insira aqui:" id="altura" type="text">
    <button onclick="cadastro()">Fale comigo</button>
</body>
</html>

<script>

function cadastro() {
    alert("Você pesa " + peso.value + "kg e tem " + altura.value)
}

</script>
