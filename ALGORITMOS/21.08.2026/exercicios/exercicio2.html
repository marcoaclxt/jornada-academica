<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    Número 1:
    <input type="text" id="iptN1">
<br><br>
    Número 2:
    <input type="text" id="iptN2">
<br><br>

    <button onclick="calculaQuociente()">Quociente</button>
    <button onclick="calcularResto()">Resto</button>
    <button onclick="calcularCompleto()">Completo</button>

    <div id="divMsg"></div>
</body>

<script>

    function calculaQuociente() {
        let n1 = Number(iptN1.value);
        let n2 = Number(iptN2.value);

        let quociente = n1 / n2;

        divMsg.innerHTML = `O quociente de ${n1} por ${n2} é: ${quociente}.`
    }

    function calcularResto() {
        let n1 = Number(iptN1.value);
        let n2 = Number(iptN2.value);

        let resto = n1 % n2;

        divMsg.innerHTML = `O resto de ${n1} por ${n2} é: ${resto}.`
    }

    function calcularCompleto() {
        let n1 = Number(iptN1.value);
        let n2 = Number(iptN2.value);

        let completo = n1 / n2;

        divMsg.innerHTML = `A divisão de ${n1} por ${n2} é: ${completo} e o resto dessa divisão é: ${n1 % n2}`
    }

</script>
</html>
