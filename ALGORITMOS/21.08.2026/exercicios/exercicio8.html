<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    Insira o valor da passagem:
    <input type="text" id="input_valor">
    <br><br>

    Insira a quantidade de viagens por mês:
    <input type="text" id="input_qtdM">
    <br><br>

    Insira a distância (KM):
    <input type="text" id="input_dist">

    <button onclick="calcular()">Calcular VT</button>

    <div id="divMsg"></div>
</body>

<script>

    function calcular() {
        let iptValor = Number(input_valor.value)
        let iptQtdM = Number(input_qtdM.value)
        let iptDist = Number(input_dist.value)
        

        let valorUber = Number(iptDist * 0.75)
        let viagensUber = Number(iptQtdM * 0.10)
        let viagensOnibus = Number(iptQtdM * 0.90)

        let gastouOnibus = Number(viagensOnibus * iptValor)
        let gastouberTotal = Number(viagensUber * valorUber)
        let gastouTotal = Number(gastouberTotal + gastouOnibus)

        divMsg.innerHTML = `Você vai gastar R$${(gastouTotal).toFixed(2)} por mês com transporte.`  
    }


</script>
</html>
