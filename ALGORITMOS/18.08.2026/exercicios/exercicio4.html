<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3. Economia com o Bilhete Único</title>
</head>
<body>
    <h2>3. Economia com o Bilhete Único</h2>

    Insira o seu peso:
    <input type="text" id="peso">
    <br>
    <br>

    Insira sua altura:
    <input type="text" id="altura">
    <br>


    <button onclick="calcularIMC()">Calcular IMC</button>

    <div id="divRe"></div>
</body> 

<script>

function calcularIMC() {
    divRe.innerHTML = `Seu IMC é de: ${(peso.value / (altura.value * altura.value)).toFixed(2)}`
}

</script>
</html>
