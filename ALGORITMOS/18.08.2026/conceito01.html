<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9. Recomendação de Clima</title>
</head>
<body>
    <h2>9. Recomendação de Clima</h2>

    <input type="text" id="temp">
    <input type="text" id="cond">

    <button onclick="identificar()">Identificar PET</button>

    <div id="divMsg">Como está o tempo?</div>
</body>
</html>

<script>

function identificar() {
    divMsg.innerHTML = `Está fazendo ${temp.value} graus e o dia está ${cond.value}`

}

</script>
