<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <label for="iptPeso">Insira o peso da criança:</label>
    <input id="iptPeso" type="text">

    <button onclick="analisar()">Analisar Peso</button>

    <div id="divRes"></div>
</body>
</html>
<script>

    function analisar() {
        let peso = Number(iptPeso.value)


        if (peso == 18.3) {
            divRes.innerHTML = `Peso perfeito<br>`
        } else if(peso <= 13.5 ) {
            divRes.innerHTML = `Classe B<br>`
        }
        
    }

</script>
