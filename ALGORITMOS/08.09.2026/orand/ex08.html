<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Insira a nota de atendimento:</span>
    <input type="text" id="iptNota">

    <button onclick="verificar()" >Avaliar atendimento</button>
</body>
</html>
<script>

    function verificar() {
        let notaAtendimento = Number(iptNota.value)

        if(notaAtendimento <= 0 && notaAtendimento >= 10) {
            alert("Nota inválida")
        } else if(notaAtendimento > 0 && notaAtendimento < 5 ) {
            alert("Não aprovado")
        } else if(notaAtendimento >= 5 && notaAtendimento <= 6 ) {
            alert("Neutro")
        } else if(notaAtendimento >= 6 ) {
            alert("Neutro")
        } 
    }

</script>
