<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Qual a temperatura atual?</span>
    <input id="iptTemp" type="text">

    <button onclick="verificar()" >Ver situação</button>
</body>
</html>
<script>

    function verificar() {
        let temp = Number(iptTemp.value)

        if(temp >= 21 && temp <= 24) {
            alert("Temperatura confortável :D")
        } else {
            alert("Temperatura DESCONFORTÁVEL :C")
        }
    }

</script>
