<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <span>Insira o tamanho da tela do celular encontrado:</span>
    <input type="text" id="iptTamTela">

    <span>Escolha a cor do celular encontrado:</span>
    <select id="selCorCelular">
        <option value="#" selected disabled>Selecione uma cor</option>
        <option value="0">Preto</option>
        <option value="1">Prata</option>
        <option value="2">Azul</option>
        <option value="3">Vermelho</option>
    </select>

    <button onclick="verificar()">Sera que ele gosta?</button>

    <div id="divRes"></div>
</body>

</html>
<script>

    function verificar() {
        let tamanhoTela = Number(iptTamTela.value)
        let corCelular = selCorCelular.value

        if (tamanhoTela >= 6.5 && corCelular == 0 || corCelular == 1) {
            divRes.innerHTML = `<img src="https://s2.glbimg.com/jsaPuF7nO23vRxQkuJ_V3WgouKA=/e.glbimg.com/og/ed/f/original/2014/06/10/461777879.jpg" />`
        } else {

            divRes.innerHTML = `<img src="https://thumbs.dreamstime.com/b/pessoa-d-deprimida-triste-51186816.jpg" />`
        }
    }


</script>
