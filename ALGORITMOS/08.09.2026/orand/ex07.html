<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Escolha o modo de pagamento:</span>
    <select id="selModoPagamento">
        <option value="#" selected disabled>Selecione um metodo</option>
        <option value="0">Dinheiro</option>
        <option value="1">Cartão de débito</option>
        <option value="2">Cartão de crédito</option>
        <option value="3">Boleto</option>
    </select>

    <button onclick="verificar()" >Analisar compra</button>
</body>
</html>
<script>

    function verificar() {
        let modoPagamento = selModoPagamento.value

        if(modoPagamento == 0 || modoPagamento == 1) {
            alert("Você terá que pagar a vista")
        } else {
            alert("Pagamento poderá ser parcelado")
        }
    }

</script>
