<script>

    function verificar() {
        let plano = iptPlano.value
        let hora = iptHora.value
        let biometrico = iptCadastro.value

        if( biometrico == 1 && (plano == 1 || (plano == 0 && (hora >= 6 || hora <= 22)))) {
            alert("Acesso liberado")
        } else {
            alert("Acesso negado")
        }
    }

</script>
