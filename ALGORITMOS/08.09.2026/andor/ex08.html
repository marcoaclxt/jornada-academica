<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8. Elegibilidade para Vacinação Prioritária</title>
</head>

<body>
    <span>Insira a idade da pessoa:</span>
    <input id="iptIdade" type="text"> <br>

    <span>A pessoa possui alguma comorbidade?</span>
    <select id="iptComorbidade">
        <option value="0">Não</option>
        <option value="1">Sim</option>
    </select><br>
    
    <span>O cadastro da pessoa no sistema de saúde está em dia?</span>
    <select id="iptCadastro">
        <option value="0">Não</option>
        <option value="1">Sim</option>
    </select><br>

    <button onclick="verificar()">Verificar prioridade</button>

    <div id="divRes"></div>
</body>
</html>

<script>

    function verificar() {
        let idade = iptIdade.value
        let comorbidade = iptComorbidade.value
        let cadastro = iptCadastro.value

        if(cadastro == 1 && (idade >= 60 || comorbidade == 1) ) {
            alert("Vacinação prioritária liberada")
        } else {
            alert("Vacinação prioritária não liberada")
        }
    }

</script>
