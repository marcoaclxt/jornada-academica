<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7. Financiamento de Veículo</title>
</head>

<body>
    <span>Insira a idade do solicitante:</span>
    <input id="iptIdade" type="text"> <br>

    <span>O solicitante possui CNH válida?</span>
    <select id="iptCnh">
        <option value="0">Não</option>
        <option value="1">Sim</option>
    </select><br>
    
    <span>Insira a renda mensal do solicitante:</span>
    <input id="iptRenda" type="text"> <br>

    <span>O solicitante apresentou um fiador?</span>
    <select id="iptFiador">
        <option value="0">Não</option>
        <option value="1">Sim</option>
    </select><br>


    <button onclick="verificar()">Analisar financiamento</button>

    <div id="divRes"></div>
</body>
</html>

<script>

    function verificar() {
        let idade = iptIdade.value
        let cnh = iptCnh.value
        let renda = iptRenda.value
        let fiador = iptFiador.value

        if(idade >= 21 && cnh == 1 && (renda >= 2500 || fiador == 1)) {
            alert("Financiamento aprovado")
        } else {
            alert("Financiamento negado")
        }
    }

</script>
