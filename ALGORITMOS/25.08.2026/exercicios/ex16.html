<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h2>16. Par ou Impar</h2>

    <span>Insira um número:</span>
    <input id="iptNum" type="text">

    <button onclick="verificar()">Analisar</button>
    
    <span style="color: red;" id="sucessoDiv"></span>
    <span style="color: blue;" id="pararDiv"></span>
<script>

function verificar() {
    let numero = Number(iptNum.value)

    let numeroCalc = numero % 2

    if (numeroCalc == 0) {
        sucessoDiv.innerHTML = `Esse número é PAR`;
    }
    if (numeroCalc != 0) {
        pararDiv.innerHTML = `Esse número é impar `;
    }
}

</script>
</body>
</html>
